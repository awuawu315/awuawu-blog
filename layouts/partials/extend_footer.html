{{- if eq .Layout "search" }}
<script>
  (() => {
    const input = document.getElementById('searchInput');
    if (!input) return;

    input.addEventListener('input', () => {
      input.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true }));
    });
  })();
</script>

<script>
  (() => {
    const menu = document.getElementById('menu');
    const switches = document.querySelector('.logo-switches');
    if (!menu || !switches || document.getElementById('awu-menu-toggle')) return;

    const button = document.createElement('button');
    button.id = 'awu-menu-toggle';
    button.type = 'button';
    button.className = 'awu-menu-toggle';
    button.setAttribute('aria-label', '打开导航菜单');
    button.setAttribute('aria-controls', 'menu');
    button.setAttribute('aria-expanded', 'false');
    button.innerHTML = '<span aria-hidden="true">☰</span>';
    switches.appendChild(button);
    document.documentElement.classList.add('awu-js-nav');

    const closeMenu = ({ returnFocus = false } = {}) => {
      menu.classList.remove('awu-menu-open');
      button.setAttribute('aria-expanded', 'false');
      button.setAttribute('aria-label', '打开导航菜单');
      if (returnFocus) button.focus();
    };

    button.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('awu-menu-open');
      button.setAttribute('aria-expanded', String(isOpen));
      button.setAttribute('aria-label', isOpen ? '关闭导航菜单' : '打开导航菜单');
    });

    menu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMenu));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menu.classList.contains('awu-menu-open')) {
        closeMenu({ returnFocus: true });
      }
    });
  })();
</script>

<script>
  (() => {
    const toc = document.getElementById('TableOfContents');
    if (!toc || !('IntersectionObserver' in window)) return;

    const links = [...toc.querySelectorAll('.awu-toc-nav a[href^="#"]')];
    const entries = links.map((link) => {
      const id = decodeURIComponent(link.hash.slice(1));
      return { link, heading: document.getElementById(id) };
    }).filter(({ heading }) => heading);
    if (!entries.length) return;

    let activeId = '';
    const setActive = (id) => {
      if (!id || id === activeId) return;
      activeId = id;
      links.forEach((link) => {
        const isActive = decodeURIComponent(link.hash.slice(1)) === id;
        link.classList.toggle('is-active', isActive);
        if (isActive) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    };

    const observer = new IntersectionObserver((observed) => {
      const current = observed
        .filter((entry) => entry.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (current) setActive(current.target.id);
    }, { rootMargin: '-18% 0px -72% 0px', threshold: 0 });

    entries.forEach(({ link, heading }) => {
      observer.observe(heading);
      link.addEventListener('click', () => setActive(heading.id));
    });

    if (window.location.hash) setActive(decodeURIComponent(window.location.hash.slice(1)));
    else setActive(entries[0].heading.id);
  })();
</script>

<script>
  (() => {
    const cue = document.querySelector('.awu-scroll-cue');
    const content = document.getElementById('content');
    if (!cue || !content) return;

    cue.addEventListener('click', (event) => {
      event.preventDefault();
      content.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  })();
</script>
